<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linux Boot Process Interactive Simulator</title>
    <!-- Google Fonts: Fira Code & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           1. CORE STYLES & DARK TERMINAL THEME
           ========================================================================== */
        :root {
            --bg-dark: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-purple: #bc8cff;
            --accent-orange: #d29922;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --font-mono: 'Fira Code', monospace;
            --font-sans: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-sans);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* App Header */
        header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        header h1 {
            font-family: var(--font-mono);
            color: var(--accent-blue);
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 5px;
        }

        /* Control Panel Header */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            background: #21262d;
            color: var(--accent-blue);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 16px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            background: var(--border-color);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(88, 166, 255, 0.3);
            border-color: var(--accent-blue);
        }

        button.btn-active {
            background: #1f6feb;
            color: #ffffff;
            border-color: var(--accent-blue);
        }

        .stage-selector {
            background: #21262d;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        /* ==========================================================================
           2. INTERACTIVE BLOCK DIAGRAM FLOWCHART
           ========================================================================== */
        .diagram-wrapper {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px 10px;
            margin-bottom: 20px;
            position: relative;
            overflow-x: auto;
        }

        .flowchart-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-width: 980px;
            padding: 0 10px;
        }

        .block {
            flex: 1;
            background: #21262d;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 6px;
            text-align: center;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .block:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            transform: translateY(-2px);
        }

        .block.active {
            background: #1f6feb;
            border-color: var(--accent-blue);
            color: #ffffff;
            box-shadow: 0 0 16px rgba(88, 166, 255, 0.6);
            transform: scale(1.05);
        }

        .block.completed {
            background: #112d23;
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .arrow-connector {
            color: var(--border-color);
            font-size: 1rem;
            font-weight: bold;
            padding: 0 2px;
            transition: color 0.3s ease;
        }

        .arrow-connector.active {
            color: var(--accent-blue);
            text-shadow: 0 0 8px var(--accent-blue);
        }

        /* ==========================================================================
           3. ANIMATION STAGE CANVAS
           ========================================================================== */
        .canvas-container {
            background: #010409;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            height: 280px;
            margin-bottom: 20px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        /* Power On Visual */
        .power-btn-glow {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid var(--accent-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: var(--accent-green);
            box-shadow: 0 0 30px rgba(63, 185, 80, 0.8);
            animation: pulse-glow 1.5s infinite alternate;
        }

        @keyframes pulse-glow {
            from { transform: scale(0.95); box-shadow: 0 0 15px rgba(63, 185, 80, 0.4); }
            to { transform: scale(1.05); box-shadow: 0 0 35px rgba(63, 185, 80, 0.9); }
        }

        /* Hardware Check Grid */
        .hw-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            width: 80%;
        }

        .hw-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            text-align: center;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            opacity: 0;
            transform: translateY(10px);
            animation: card-appear 0.4s forwards ease-out;
        }

        .hw-card.pass {
            border-color: var(--accent-green);
            color: var(--accent-green);
            background: #0d281e;
        }

        @keyframes card-appear {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Storage Scanning Flow */
        .storage-scan {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .device-node {
            padding: 15px 25px;
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: all 0.3s;
        }

        .device-node.active-boot {
            border-color: var(--accent-green);
            color: var(--accent-green);
            box-shadow: 0 0 15px rgba(63, 185, 80, 0.4);
        }

        /* Data Transfer Packet */
        .packet-pipe {
            width: 120px;
            height: 4px;
            background: var(--border-color);
            position: relative;
            overflow: hidden;
            border-radius: 2px;
        }

        .packet {
            width: 30px;
            height: 100%;
            background: var(--accent-blue);
            box-shadow: 0 0 10px var(--accent-blue);
            position: absolute;
            animation: pipe-flow 1.2s infinite linear;
        }

        @keyframes pipe-flow {
            from { left: -30px; }
            to { left: 120px; }
        }

        /* Terminal Display Screen */
        .terminal-box {
            width: 85%;
            height: 80%;
            background: #000000;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 18px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--accent-green);
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
            overflow-y: auto;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background: var(--accent-green);
            margin-left: 4px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* ==========================================================================
           4. MAIN CONTENT & EDUCATIONAL PANELS
           ========================================================================== */
        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .info-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        .info-panel h2 {
            font-family: var(--font-mono);
            color: var(--accent-blue);
            font-size: 1.2rem;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .info-card {
            background: #21262d;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
        }

        .info-card label {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            display: block;
            margin-bottom: 4px;
        }

        .info-card p {
            font-size: 0.9rem;
            color: var(--text-main);
            line-height: 1.4;
        }

        /* Keyword Badges */
        .keywords-container {
            margin-top: 15px;
        }

        .keywords-title {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .badge-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .keyword-badge {
            background: #21262d;
            color: var(--accent-blue);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 4px 10px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .keyword-badge:hover {
            background: var(--accent-blue);
            color: #ffffff;
            border-color: var(--accent-blue);
            box-shadow: 0 0 10px rgba(88, 166, 255, 0.4);
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 1px solid var(--accent-blue);
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            padding: 24px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .modal-title {
            font-family: var(--font-mono);
            color: var(--accent-blue);
            font-size: 1.1rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #ffffff;
        }

        /* Tabbed Log & Quiz Section */
        .bottom-tabs {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 4px;
        }

        .tab-btn.active {
            background: #21262d;
            color: var(--accent-blue);
            border: 1px solid var(--border-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Quiz Layout */
        .quiz-option {
            background: #21262d;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            margin: 8px 0;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quiz-option:hover {
            border-color: var(--accent-blue);
            background: #30363d;
        }

        .quiz-option.correct {
            background: #112d23;
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .quiz-option.incorrect {
            background: #3c1e1e;
            border-color: #f85149;
            color: #f85149;
        }
    </style>
</head>
<body>

    <!-- APPLICATION HEADER -->
    <header>
        <h1>🐧 Linux Boot Process Interactive Simulator</h1>
        <p>A step-by-step educational visualization of the Linux operating system boot sequence</p>
    </header>

    <!-- CONTROL PANEL BAR -->
    <div class="controls-bar">
        <div class="btn-group">
            <button id="prevBtn" onclick="prevStage()">⏮ PREVIOUS</button>
            <button id="nextBtn" onclick="nextStage()">NEXT ⏭</button>
            <button id="playBtn" onclick="toggleAutoPlay()">▶ START SIMULATION</button>
            <button id="restartBtn" onclick="restartSimulation()">🔄 RESTART</button>
        </div>
        <div>
            <select id="stageSelect" class="stage-selector" onchange="jumpToStage(this.value)">
                <!-- Dropdown populated dynamically -->
            </select>
        </div>
    </div>

    <!-- MAIN BLOCK DIAGRAM FLOWCHART -->
    <div class="diagram-wrapper">
        <div class="flowchart-container" id="flowchart">
            <!-- Diagram blocks populated by JS -->
        </div>
    </div>

    <!-- ANIMATION CANVAS -->
    <div class="canvas-container" id="stageCanvas">
        <!-- Stage specific dynamic animation loaded by JS -->
    </div>

    <!-- EXPLANATION & KEYWORD PANELS -->
    <div class="main-content">
        <div class="info-panel">
            <h2 id="stageTitle">Stage Title</h2>
            <div class="info-grid">
                <div class="info-card">
                    <label>What is Happening?</label>
                    <p id="whatHappens">Explanation text...</p>
                </div>
                <div class="info-card">
                    <label>Why Does it Happen?</label>
                    <p id="whyHappens">Explanation text...</p>
                </div>
                <div class="info-card">
                    <label>Responsible Component</label>
                    <p id="responsibleComp" style="color: var(--accent-blue); font-weight: 600;">Component</p>
                </div>
                <div class="info-card">
                    <label>Next Phase</label>
                    <p id="nextPhase" style="color: var(--accent-green); font-weight: 600;">Next Stage</p>
                </div>
            </div>

            <div class="keywords-container">
                <div class="keywords-title">Click keywords for instant technical definition:</div>
                <div class="badge-group" id="keywordBadges">
                    <!-- Keyword badges inserted dynamically -->
                </div>
            </div>
        </div>

        <!-- INSIDE THE COMPUTER HARDWARE STATUS -->
        <div class="info-panel">
            <h2>🖥 Inside the Computer</h2>
            <div style="display: flex; flex-direction: column; gap: 12px;" id="hardwareStatus">
                <!-- Hardware details populated dynamically -->
            </div>
        </div>
    </div>

    <!-- TABBED SECTION: CONSOLE LOGS & QUIZ -->
    <div class="bottom-tabs">
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('logsTab', this)">📜 Boot Log Console (dmesg)</button>
            <button class="tab-btn" onclick="switchTab('quizTab', this)">🧪 Knowledge Quiz</button>
        </div>

        <div id="logsTab" class="tab-content active">
            <div class="terminal-box" id="terminalLog">
                <!-- Log entries streamed here -->
            </div>
        </div>

        <div id="quizTab" class="tab-content">
            <div id="quizContainer">
                <!-- Quiz questions loaded dynamically -->
            </div>
        </div>
    </div>

    <!-- KEYWORD MODAL POPUP -->
    <div class="modal-overlay" id="keywordModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTerm">Term Title</div>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <p id="modalDef" style="line-height: 1.5; color: var(--text-main); font-size: 0.95rem;"></p>
        </div>
    </div>

    <!-- JavaScript Simulator Engine -->
    <script>
        /* ==========================================================================
           DATA DEFINITIONS FOR STAGES, KEYWORDS, AND QUIZ
           ========================================================================== */
        const STAGES = [
            {
                id: 0,
                name: "POWER ON",

            },
            {

                next: "GRUB Execution",

                cpu: "Polling Storage Controllers",
                ram: "Loading EFI Drivers",
                storage: "Reading EFI Partition",
                logs: [
                    "[  0.001500] Scanning boot priority device list...",
                    "[  0.002100] Found EFI System Partition (ESP) on NVMe SSD (/dev/nvme0n1p1).",

            {

            },
            {

                keywords: ["Kernel", "Memory Management", "Drivers", "CPU"],
                cpu: "Executing Ring 0 Kernel Space",
                ram: "Virtual Paging Configured",
                storage: "Driver Probing Active",
                logs: [
                    "[  0.000000] Linux version 6.5.0-generic (buildd@amd64) SMP",
                    "[  0.004120] Memory: 16124MB available (1024K kernel code)",
                    "[  0.035100] PCI: Probing PCI hardware buses... Done."

            },
            {
                id: 5,

                logs: [

            },
            {

                keywords: ["systemd", "PID 1", "Userspace", "Targets"],
                cpu: "Executing PID 1 systemd",
                ram: "User Address Space Active",
                storage: "Parsing /etc/systemd/",
                logs: [

                    "[  0.250500] systemd 252.4 running in system mode.",
                    "[  0.260000] Queueing default target: graphical.target."
                ]
            },
            {
                id: 7,
                name: "SYSTEM SERVICES",
                title: "Stage 8: Parallel Service Launch",
                responsible: "systemd Unit Files",
                what: "systemd starts networking, system logs, display managers, and background daemons in parallel.",
                why: "Brings the operating system to a fully functional multi-user or graphical state.",
                next: "Login Prompt",
                keywords: ["Services", "Networking", "D-Bus", "Display Manager"],
                cpu: "Parallel Service Threads",
                ram: "Daemons Loaded",
                storage: "Logging Active",
                logs: [
                    "[  0.310200] [ OK ] Started Journal Service.",
                    "[  0.342100] [ OK ] Started Network Manager.",
                    "[  0.410500] [ OK ] Started OpenSSH Server Daemon.",
                    "[  0.450000] [ OK ] Reached target Multi-User System Target."
                ]
            },
            {
                id: 8,
                name: "LOGIN PROMPT",
                title: "Stage 9: User Authentication & Login",
                responsible: "GDM / LightDM / getty",
                what: "Launches the text terminal or graphical login screen waiting for user credentials.",
                why: "Protects system resources and creates isolated user shell environments.",
                next: "User Session Active",
                keywords: ["Authentication", "getty", "User Session", "PAM"],
                cpu: "Idle Waiting Input",
                ram: "Session Allocation Ready",
                storage: "PAM Auth Verification",
                logs: [
                    "[  0.482000] [ OK ] Started GNOME Display Manager.",
                    "[  0.500000] Reached target Graphical Interface / Boot Complete.",
                    "",
                    "Ubuntu 24.04 LTS linux-host tty1",
                    "login: _"
                ]
            }
        ];

        const KEYWORDS_DB = {
            "CPU": "Central Processing Unit. Executes machine instructions. At power-on, it begins at a fixed location known as the reset vector.",
            "Power Supply": "Converts wall power into stable DC voltages (12V, 5V, 3.3V) and sends a 'Power-Good' signal to wake the CPU.",
            "Reset Vector": "A fixed hardware memory address (e.g. 0xFFFFFFF0) where the CPU starts execution immediately upon receiving power.",
            "Firmware": "Low-level software embedded in motherboard ROM chips (BIOS/UEFI) that initializes hardware.",
            "BIOS": "Legacy Basic Input/Output System firmware that checks hardware and loads bootloader code from disk sector 0 (MBR).",
            "UEFI": "Unified Extensible Firmware Interface. Modern replacement for BIOS supporting GPT disks, secure boot, and NVMe drives.",
            "POST": "Power-On Self-Test. Firmware diagnostic sequence verifying RAM, storage controllers, and processor integrity.",
            "Boot Order": "Firmware configuration list defining the priority sequence for checking connected storage drives for a bootloader.",
            "NVMe SSD": "Non-Volatile Memory Express Solid State Drive. High-speed storage attached via PCIe bus.",
            "ESP": "EFI System Partition. A FAT32 partition containing .efi bootloader files invoked by UEFI firmware.",
            "GPT": "GUID Partition Table. Modern disk partition scheme supporting drive sizes above 2TB and dedicated EFI partitions.",
            "GRUB": "Grand Unified Bootloader. Software that provides a boot menu and loads the compressed Linux kernel and initramfs into RAM.",
            "Bootloader": "An intermediate program bridging firmware and the operating system kernel.",
            "vmlinuz": "The compressed, self-extracting Linux kernel executable image loaded into memory by GRUB.",
            "RAM": "Random Access Memory. Volatile high-speed system memory holding the running kernel, processes, and runtime data.",
            "Kernel": "The core component of the operating system managing hardware drivers, virtual memory, and process scheduling.",
            "Memory Management": "Subsystem configuring virtual memory pages, hardware MMU isolation, and RAM allocation.",
            "Drivers": "Kernel modules enabling software to communicate with hardware controllers (GPUs, NICs, Disks).",
            "initramfs": "Initial RAM Filesystem. Temporary root filesystem loaded into memory containing drivers required to mount the real disk.",
            "Root Filesystem": "The primary persistent disk directory structure (/) containing OS files, utilities, and configuration.",
            "pivot_root": "System call inside initramfs that swaps the temporary RAM root directory with the real storage disk root.",
            "systemd": "Modern init system launching as PID 1, managing service dependencies, sockets, and target states.",
            "PID 1": "Process ID 1. The first user-space process spawned by the Linux kernel; parent of all user processes.",
            "Userspace": "Protected ring where normal applications run without direct access to kernel hardware layers.",
            "Targets": "systemd unit groupings representing operating states (e.g., multi-user.target, graphical.target).",
            "Services": "Background daemons managed by systemd providing features like SSH, Networking, and Audio.",
            "Networking": "Daemon managing network interface hardware, IP routing tables, and DHCP requests.",
            "D-Bus": "Inter-process communication bus allowing Linux applications and services to exchange messages.",
            "Display Manager": "Graphical login service (GDM/LightDM) initializing the display server (Wayland/X11).",
            "Authentication": "Verification process checking user passwords/keys before launching a desktop or terminal session.",
            "getty": "Terminal driver process managing text console sessions (tty1-tty6) for command-line logins.",
            "User Session": "The interactive shell or graphical desktop environment created after successful authentication."
        };

        const QUIZ_QUESTIONS = [
            {
                q: "Which component executes FIRST immediately upon receiving motherboard electrical power?",
                options: ["GRUB Bootloader", "BIOS / UEFI Firmware", "Linux Kernel", "systemd PID 1"],
                ans: 1,
                explanation: "The CPU starts execution at the reset vector pointing directly to system firmware (BIOS/UEFI)."
            },
            {
                q: "What is the primary function of the GRUB bootloader?",
                options: ["Execute POST hardware checks", "Load the Linux kernel and initramfs into RAM", "Start background network services", "Mount the encrypted disk"],
                ans: 1,
                explanation: "GRUB locates the compressed kernel image on disk, loads it into system RAM, and transfers execution control."
            },
            {
                q: "Why is an 'initramfs' image required during the Linux boot process?",
                options: ["To display a graphical desktop animation", "To provide temporary storage drivers needed to locate and mount the real root partition", "To replace systemd as PID 1", "To test system memory speed"],
                ans: 1,
                explanation: "initramfs lives in RAM and contains block storage, decryption, and LVM drivers required before the real disk can be accessed."
            }
        ];

        /* ==========================================================================
           STATE & SIMULATION CONTROL ENGINE
           ========================================================================== */
        let currentStageIndex = 0;
        let isAutoPlaying = false;
        let autoPlayTimer = null;

        // Initialize Simulator on Load
        window.addEventListener('DOMContentLoaded', () => {
            renderFlowchart();
            populateDropdown();
            updateStageDisplay();
            renderQuiz();
        });

        function renderFlowchart() {
            const container = document.getElementById('flowchart');
            container.innerHTML = '';

            STAGES.forEach((stage, idx) => {
                const block = document.createElement('div');
                block.className = `block ${idx === currentStageIndex ? 'active' : (idx < currentStageIndex ? 'completed' : '')}`;
                block.innerText = `${idx + 1}. ${stage.name}`;
                block.onclick = () => jumpToStage(idx);
                container.appendChild(block);

                if (idx < STAGES.length - 1) {
                    const arrow = document.createElement('div');
                    arrow.className = `arrow-connector ${idx < currentStageIndex ? 'active' : ''}`;
                    arrow.innerText = '➔';
                    container.appendChild(arrow);
                }
            });
        }

        function populateDropdown() {
            const select = document.getElementById('stageSelect');
            select.innerHTML = '';
            STAGES.forEach((stage, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.innerText = `${idx + 1}. ${stage.name}`;
                select.appendChild(opt);
            });
        }

        function updateStageDisplay() {
            const stage = STAGES[currentStageIndex];

            // Update Flowchart State
            renderFlowchart();
            document.getElementById('stageSelect').value = currentStageIndex;

            // Update Information Panels
            document.getElementById('stageTitle').innerText = stage.title;
            document.getElementById('whatHappens').innerText = stage.what;
            document.getElementById('whyHappens').innerText = stage.why;
            document.getElementById('responsibleComp').innerText = stage.responsible;
            document.getElementById('nextPhase').innerText = stage.next;

            // Render Keyword Badges
            const badgeContainer = document.getElementById('keywordBadges');
            badgeContainer.innerHTML = '';
            stage.keywords.forEach(kw => {
                const badge = document.createElement('div');
                badge.className = 'keyword-badge';
                badge.innerText = `[${kw}]`;
                badge.onclick = () => openModal(kw);
                badgeContainer.appendChild(badge);
            });

            // Update Hardware Status
            const hwContainer = document.getElementById('hardwareStatus');
            hwContainer.innerHTML = `
                <div class="info-card"><label>CPU State</label><p style="color:var(--accent-blue);">${stage.cpu}</p></div>
                <div class="info-card"><label>RAM Contents</label><p style="color:var(--accent-purple);">${stage.ram}</p></div>
                <div class="info-card"><label>Storage Bus</label><p style="color:var(--accent-orange);">${stage.storage}</p></div>
            `;

            // Update Animation Canvas
            renderCanvasAnimation(currentStageIndex);

            // Stream Terminal Console Logs
            streamLogs();
        }

        function renderCanvasAnimation(idx) {
            const canvas = document.getElementById('stageCanvas');
            canvas.innerHTML = '';

            if (idx === 0) {
                canvas.innerHTML = `
                    <div style="display:flex; flex-direction:column; align-items:center; gap:15px;">
                        <div class="power-btn-glow">⏻</div>
                        <div style="color:var(--accent-green); font-family:var(--font-mono); font-weight:bold;">
                            ELECTRICAL CURRENT STABILIZED ➔ CPU RESET VECTOR ACTIVATED
                        </div>
                    </div>`;
            } else if (idx === 1) {
                canvas.innerHTML = `
                    <div class="hw-grid">
                        <div class="hw-card pass" style="animation-delay:0.1s">CPU: OK<br><small>8 Cores Active</small></div>
                        <div class="hw-card pass" style="animation-delay:0.3s">RAM: OK<br><small>16GB DDR4 Pass</small></div>
                        <div class="hw-card pass" style="animation-delay:0.5s">NVMe SSD: OK<br><small>Bus Online</small></div>
                        <div class="hw-card pass" style="animation-delay:0.7s">UEFI: OK<br><small>v2.80 Ready</small></div>
                    </div>`;
            } else if (idx === 2) {
                canvas.innerHTML = `
                    <div class="storage-scan">
                        <div class="device-node">USB Mass Drive</div>
                        <div class="packet-pipe"><div class="packet"></div></div>
                        <div class="device-node active-boot">NVMe SSD (Bootable ESP)</div>
                    </div>`;
            } else if (idx === 3) {
                canvas.innerHTML = `
                    <div style="width:75%; background:var(--panel-bg); border:1px solid var(--accent-blue); border-radius:6px; padding:15px; font-family:var(--font-mono);">
                        <div style="color:var(--accent-blue); font-weight:bold; margin-bottom:10px; border-bottom:1px solid var(--border-color); padding-bottom:5px;">
                            GNU GRUB version 2.06
                        </div>
                        <div style="background:#1f6feb; color:#fff; padding:6px 10px; border-radius:4px; margin-bottom:6px;">
                            * Ubuntu Linux (vmlinuz-6.5.0-generic)
                        </div>
                        <div style="color:var(--text-muted); padding:4px 10px;">Advanced boot options</div>
                    </div>`;
            } else if (idx === 4) {
                canvas.innerHTML = `
                    <div style="display:flex; align-items:center; gap:20px; font-family:var(--font-mono);">
                        <div style="padding:15px; background:var(--panel-bg); border:2px solid var(--accent-orange); color:var(--accent-orange); border-radius:6px; font-weight:bold;">GRUB</div>
                        <div class="packet-pipe"><div class="packet"></div></div>
                        <div style="padding:15px; background:var(--panel-bg); border:2px solid var(--accent-purple); color:var(--accent-purple); border-radius:6px; font-weight:bold;">Linux Kernel (RAM)</div>
                    </div>`;
            } else if (idx === 5) {
                canvas.innerHTML = `
                    <div style="text-align:center; font-family:var(--font-mono);">
                        <div style="padding:12px 25px; background:#261c14; border:1px solid var(--accent-orange); color:var(--accent-orange); border-radius:6px; font-weight:bold; margin-bottom:10px;">
                            Temporary RAM Root (initramfs)
                        </div>
                        <div style="color:var(--text-muted); font-size:0.85rem;">
                            ↓ Loading storage modules → Mounting real root SSD (/dev/nvme0n1p2)
                        </div>
                    </div>`;
            } else if (idx === 6) {
                canvas.innerHTML = `
                    <div style="text-align:center; font-family:var(--font-mono);">
                        <div style="padding:15px 35px; background:var(--panel-bg); border:2px solid var(--accent-blue); color:var(--accent-blue); border-radius:8px; font-weight:bold; font-size:1.1rem;">
                            systemd (PID 1)
                        </div>
                        <div style="color:var(--accent-green); font-size:0.85rem; margin-top:10px;">
                            Parsing /etc/systemd/system unit dependencies...
                        </div>
                    </div>`;
            } else if (idx === 7) {
                canvas.innerHTML = `
                    <div style="width:80%; display:flex; flex-direction:column; gap:8px; font-family:var(--font-mono);">
                        <div style="background:var(--panel-bg); border:1px solid var(--border-color); padding:8px 12px; border-radius:4px; display:flex; justify-shadow:space-between;">
                            <span>[ OK ] Started Journal Service</span><span style="color:var(--accent-green); margin-left:auto;">ACTIVE</span>
                        </div>
                        <div style="background:var(--panel-bg); border:1px solid var(--border-color); padding:8px 12px; border-radius:4px; display:flex; justify-shadow:space-between;">
                            <span>[ OK ] Started Network Manager</span><span style="color:var(--accent-green); margin-left:auto;">ACTIVE</span>
                        </div>
                        <div style="background:var(--panel-bg); border:1px solid var(--border-color); padding:8px 12px; border-radius:4px; display:flex; justify-shadow:space-between;">
                            <span>[ OK ] Reached target Graphical Interface</span><span style="color:var(--accent-green); margin-left:auto;">READY</span>
                        </div>
                    </div>`;
            } else if (idx === 8) {
                canvas.innerHTML = `
                    <div class="terminal-box">
                        <div>Ubuntu 24.04 LTS linux-host tty1</div><br>
                        <div>linux-host login: <span style="color:#fff;">student</span></div>
                        <div>Password: <span style="color:#fff;">••••••••••••</span></div><br>
                        <div style="color:var(--accent-green);">Welcome to Linux 6.5.0-generic x86_64!</div>
                        <div>student@linux-host:~$ <span class="cursor"></span></div>
                    </div>`;
            }
        }

        function streamLogs() {
            const terminal = document.getElementById('terminalLog');
            let accumulatedLogs = [];
            for (let i = 0; i <= currentStageIndex; i++) {
                accumulatedLogs = accumulatedLogs.concat(STAGES[i].logs);
            }
            terminal.innerHTML = accumulatedLogs.map(line => `<div>${line}</div>`).join('');
            terminal.scrollTop = terminal.scrollHeight;
        }

        /* ==========================================================================
           NAVIGATION CONTROLS
           ========================================================================== */
        function nextStage() {
            if (currentStageIndex < STAGES.length - 1) {
                currentStageIndex++;
                updateStageDisplay();
            } else if (isAutoPlaying) {
                toggleAutoPlay();
            }
        }

        function prevStage() {
            if (currentStageIndex > 0) {
                currentStageIndex--;
                updateStageDisplay();
            }
        }

        function jumpToStage(idx) {
            currentStageIndex = parseInt(idx);
            updateStageDisplay();
        }

        function toggleAutoPlay() {
            const btn = document.getElementById('playBtn');
            if (!isAutoPlaying) {
                isAutoPlaying = true;
                btn.innerText = "⏸ PAUSE";
                btn.classList.add('btn-active');
                autoPlayTimer = setInterval(() => {
                    nextStage();
                }, 3000);
            } else {
                isAutoPlaying = false;
                btn.innerText = "▶ START SIMULATION";
                btn.classList.remove('btn-active');
                clearInterval(autoPlayTimer);
            }
        }

        function restartSimulation() {
            if (isAutoPlaying) toggleAutoPlay();
            currentStageIndex = 0;
            updateStageDisplay();
        }

        /* ==========================================================================
           KEYWORD MODAL POPUP ENGINE
           ========================================================================== */
        function openModal(term) {
            const modal = document.getElementById('keywordModal');
            document.getElementById('modalTerm').innerText = term;
            document.getElementById('modalDef').innerText = KEYWORDS_DB[term] || "Technical definition unavailable.";
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('keywordModal').classList.remove('active');
        }

        /* ==========================================================================
           QUIZ ENGINE & TAB SWITCHING
           ========================================================================== */
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function renderQuiz() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';

            QUIZ_QUESTIONS.forEach((q, qIdx) => {
                const qBox = document.createElement('div');
                qBox.style.marginBottom = '20px';
                qBox.innerHTML = `<div style="font-family:var(--font-mono); font-weight:bold; margin-bottom:8px;">Q${qIdx + 1}: ${q.q}</div>`;

                q.options.forEach((opt, optIdx) => {
                    const optBtn = document.createElement('div');
                    optBtn.className = 'quiz-option';
                    optBtn.innerText = `${String.fromCharCode(65 + optIdx)}. ${opt}`;
                    optBtn.onclick = () => checkQuizAnswer(qIdx, optIdx, qBox);
                    qBox.appendChild(optBtn);
                });

                container.appendChild(qBox);
            });
        }

        function checkQuizAnswer(qIdx, selectedOpt, container) {
            const q = QUIZ_QUESTIONS[qIdx];
            const options = container.querySelectorAll('.quiz-option');

            options.forEach((el, idx) => {
                el.style.pointerEvents = 'none';
                if (idx === q.ans) {
                    el.classList.add('correct');
                } else if (idx === selectedOpt) {
                    el.classList.add('incorrect');
                }
            });

            const exp = document.createElement('div');
            exp.style.marginTop = '8px';
            exp.style.fontSize = '0.85rem';
            exp.style.color = 'var(--text-muted)';
            exp.innerText = `Explanation: ${q.explanation}`;
            container.appendChild(exp);
        }
    </script>
</body>
</html>
